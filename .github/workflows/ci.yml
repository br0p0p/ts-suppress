name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint --format=github

      - name: Format check
        run: pnpm run fmt:check

      - name: Build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        typescript: ["5.9"]
        include:
          - node-version: 24
            typescript: "6"
    name: Test (Node ${{ matrix.node-version }}, TS ${{ matrix.typescript }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Swap in TypeScript 6
        if: matrix.typescript == '6'
        run: pnpm add -D --ignore-scripts "typescript@npm:@typescript/typescript6@^6.0.2"

      - name: TypeScript version
        run: node -p "require('typescript').version"

      - name: Test
        run: pnpm test
